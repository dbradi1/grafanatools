<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Flow request path and network diagram">
  <defs>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #1d1d1f; }
      .label { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #2b2b2d; }
      .small { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #2b2b2d; }
      .box { fill: #f8f8f8; stroke: #4a4a4a; stroke-width: 1.8; rx: 16; }
      .dashed { fill: none; stroke: #4a4a4a; stroke-width: 1.8; stroke-dasharray: 8 8; rx: 18; }
      .blue { fill: #dfeafc; stroke: #5f8eea; stroke-width: 2; }
      .arrow { stroke: #3f3f3f; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-stroke { stroke: #3f3f3f; stroke-width: 2; fill: none; }
      .checkbox { fill: none; stroke: #3f3f3f; stroke-width: 2; }
      .check { fill: #2c2c2c; }
      .muted { fill: rgba(0,0,0,0.40); }
      .monospace { font: 600 20px 'Consolas', 'SFMono-Regular', monospace; fill: #2b2b2d; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#3f3f3f"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f1f1f1"/>

  <text x="86" y="72" class="title">Flow request path and network: what we watch at each hop</text>

  <!-- watched toggles -->
  <rect x="60" y="118" width="20" height="20" class="checkbox"/>
  <text x="95" y="136" class="label">Watched now</text>

  <rect x="290" y="118" width="20" height="20" class="checkbox"/>
  <line x1="298" y1="128" x2="306" y2="136" class="arrow-stroke"/>
  <line x1="306" y1="136" x2="314" y2="122" class="arrow-stroke"/>
  <text x="325" y="136" class="label">Phase 2 (network)</text>

  <!-- Top row -->
  <rect x="76" y="180" width="160" height="155" class="dashed"/>
  <text x="100" y="220" class="label">User</text>
  <text x="95" y="262" class="label">internet</text>
  <text x="92" y="302" class="label">outside check</text>

  <rect x="280" y="182" width="186" height="150" class="box"/>
  <text x="308" y="226" class="label">Barracuda</text>
  <text x="302" y="260" class="label">WaaS (WAF)</text>
  <text x="326" y="286" class="small">Phase 2</text>

  <rect x="524" y="184" width="180" height="148" class="box"/>
  <text x="560" y="226" class="label">App Gateway</text>
  <text x="578" y="260" class="label">Azure</text>
  <text x="548" y="286" class="small">Azure metrics</text>

  <rect x="770" y="184" width="170" height="148" class="box"/>
  <text x="804" y="226" class="label">Internal LB</text>
  <text x="810" y="260" class="label">Azure</text>
  <text x="790" y="286" class="small">Azure metrics</text>

  <rect x="1006" y="184" width="170" height="148" class="box"/>
  <text x="1072" y="226" class="label">Traefik</text>
  <text x="1088" y="260" class="label">AKS</text>
  <text x="1048" y="286" class="small">Traefik metrics</text>

  <rect x="1238" y="182" width="250" height="150" class="blue"/>
  <text x="1282" y="224" class="label">Flow (Jira)</text>
  <text x="1300" y="260" class="label">AKS</text>
  <text x="1266" y="286" class="small">JMX + pods</text>

  <!-- vertical flow to DB -->
  <line x1="1388" y1="332" x2="1388" y2="442" class="arrow"/>

  <rect x="1238" y="448" width="250" height="150" class="box"/>
  <text x="1304" y="490" class="label">PostgreSQL</text>
  <text x="1316" y="524" class="label">Azure</text>
  <text x="1288" y="550" class="small">Azure metrics</text>

  <!-- middle row -->
  <rect x="980" y="510" width="180" height="120" class="box"/>
  <text x="1034" y="552" class="label">Private DNS</text>
  <text x="1044" y="580" class="label">Azure</text>
  <text x="1018" y="606" class="small">Azure metrics</text>

  <rect x="1188" y="510" width="180" height="120" class="box"/>
  <text x="1237" y="552" class="label">CoreDNS</text>
  <text x="1268" y="580" class="label">AKS</text>
  <text x="1227" y="606" class="small">job coredns</text>

  <text x="652" y="470" class="label">Flow calls on-prem over the site-to-site VPN</text>

  <!-- lower row -->
  <line x1="130" y1="412" x2="130" y2="644" class="arrow"/>

  <rect x="80" y="690" width="180" height="130" class="box"/>
  <text x="108" y="734" class="label">VPN gateway</text>
  <text x="129" y="766" class="label">Azure</text>
  <text x="92" y="792" class="small">Azure metrics</text>

  <rect x="316" y="690" width="200" height="130" class="dashed"/>
  <text x="354" y="734" class="label">VPN tunnel</text>
  <text x="345" y="766" class="label">1 of 7 S2S links</text>
  <text x="356" y="792" class="small">which one: P2</text>

  <rect x="610" y="690" width="180" height="130" class="dashed"/>
  <text x="649" y="734" class="label">Firewall</text>
  <text x="658" y="766" class="label">on-prem</text>
  <text x="646" y="792" class="small">Phase 2</text>

  <rect x="849" y="690" width="170" height="130" class="box"/>
  <text x="885" y="734" class="label">Nginx</text>
  <text x="878" y="766" class="label">MTLAPNGNX3</text>
  <text x="858" y="792" class="small">node + AKS test</text>

  <rect x="1080" y="690" width="170" height="130" class="box"/>
  <text x="1116" y="734" class="label">SAP SL</text>
  <text x="1102" y="766" class="label">MTLAPSAPLIC2</text>
  <text x="1102" y="792" class="small">windows + TCP</text>

  <rect x="1300" y="690" width="180" height="130" class="box"/>
  <text x="1336" y="734" class="label">SAP SQL</text>
  <text x="1325" y="766" class="label">MTLAPSAPSQL2</text>
  <text x="1320" y="792" class="small">windows + SQL</text>

  <!-- lower branch to application -->
  <rect x="620" y="840" width="210" height="120" class="box"/>
  <text x="677" y="884" class="label">HEBIS</text>
  <text x="658" y="912" class="label">MTLAPIIS5</text>
  <text x="632" y="938" class="small">Allow + AKS test</text>

  <rect x="904" y="840" width="212" height="120" class="box"/>
  <text x="962" y="884" class="label">WMS API</text>
  <text x="953" y="912" class="label">MTLAPIIS3</text>
  <text x="937" y="938" class="small">windows + HTTP</text>

  <text x="86" y="870" class="label">AKS test = test call from</text>
  <text x="86" y="900" class="label">inside AKS, same path as Flow</text>
  <text x="86" y="928" class="label">(job flow-aks-to-onprem)</text>

  <!-- connectors -->
  <line x1="236" y1="255" x2="280" y2="255" class="arrow"/>
  <line x1="466" y1="255" x2="524" y2="255" class="arrow"/>
  <line x1="704" y1="255" x2="770" y2="255" class="arrow"/>
  <line x1="940" y1="255" x2="1006" y2="255" class="arrow"/>
  <line x1="1176" y1="255" x2="1238" y2="255" class="arrow"/>

  <line x1="1040" y1="332" x2="1040" y2="510" class="arrow"/>
  <line x1="1280" y1="332" x2="1280" y2="510" class="arrow"/>
  <line x1="1280" y1="630" x2="1280" y2="700" class="arrow"/>

  <line x1="890" y1="755" x2="1080" y2="755" class="arrow"/>
  <line x1="299" y1="754" x2="610" y2="754" class="arrow"/>
  <line x1="260" y1="755" x2="316" y2="755" class="arrow"/>

  <line x1="794" y1="820" x2="794" y2="866" class="arrow"/>
  <line x1="1068" y1="820" x2="1068" y2="866" class="arrow"/>

  <!-- dashed cluster boxes in top/orange connectors area -->
  <rect x="178" y="180" width="104" height="150" class="dashed"/>
  <rect x="254" y="180" width="34" height="150" class="dashed"/>
  <rect x="408" y="182" width="110" height="150" class="dashed"/>
  <rect x="698" y="184" width="70" height="148" class="dashed"/>
  <rect x="944" y="184" width="58" height="148" class="dashed"/>
</svg>
