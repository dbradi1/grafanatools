<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="876" viewBox="0 0 1344 876" preserveAspectRatio="none" role="img" aria-labelledby="title description">
  <title id="title">Flow request path and network: what we watch at each hop</title>
  <desc id="description">A diagram showing the monitored request path from a user through Azure and AKS to Flow, then over a site-to-site VPN to on-premises services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c7c6bd"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #171717; }
      .title { font-size: 27px; font-weight: 700; }
      .legend { font-size: 20px; fill: #555550; }
      .name { font-size: 21px; font-weight: 700; }
      .detail { font-size: 20px; }
      .muted { fill: #5b5b57; }
      .box { fill: #fff; stroke: #c7c6bd; stroke-width: 2.2; }
      .phase { fill: #fff; stroke: #c7c6bd; stroke-width: 2.2; stroke-dasharray: 9 7; }
      .flow { fill: #e6f0ff; stroke: #2f80ed; stroke-width: 2.5; }
      .connector { fill: none; stroke: #c7c6bd; stroke-width: 2.2; marker-end: url(#arrow); }
      .plain { fill: none; stroke: #c7c6bd; stroke-width: 2.2; }
    </style>
  </defs>

  <rect width="1344" height="876" fill="#fff"/>
  <text x="42" y="53" class="title">Flow request path and network: what we watch at each hop</text>

  <!-- Legend -->
  <rect x="42" y="75" width="36" height="25" rx="8" class="box"/>
  <text x="92" y="96" class="legend">Watched now</text>
  <rect x="282" y="75" width="36" height="25" rx="8" class="phase"/>
  <text x="332" y="96" class="legend">Phase 2 (network)</text>

  <!-- Request path: internet to Flow -->
  <g>
    <rect x="42" y="127" width="177" height="127" rx="15" class="phase"/>
    <text x="60" y="166" class="name">User</text>
    <text x="60" y="198" class="detail">internet</text>
    <text x="60" y="230" class="detail muted">outside check</text>
  </g>
  <g>
    <rect x="258" y="127" width="177" height="127" rx="15" class="phase"/>
    <text x="276" y="166" class="name">Barracuda</text>
    <text x="276" y="198" class="detail">WaaS (WAF)</text>
    <text x="276" y="230" class="detail muted">Phase 2</text>
  </g>
  <g>
    <rect x="473" y="127" width="178" height="127" rx="15" class="box"/>
    <text x="492" y="166" class="name">App Gateway</text>
    <text x="492" y="198" class="detail">Azure</text>
    <text x="492" y="230" class="detail muted">Azure metrics</text>
  </g>
  <g>
    <rect x="689" y="127" width="178" height="127" rx="15" class="box"/>
    <text x="708" y="166" class="name">Internal LB</text>
    <text x="708" y="198" class="detail">Azure</text>
    <text x="708" y="230" class="detail muted">Azure metrics</text>
  </g>
  <g>
    <rect x="905" y="127" width="178" height="127" rx="15" class="box"/>
    <text x="923" y="166" class="name">Traefik</text>
    <text x="923" y="198" class="detail">AKS</text>
    <text x="923" y="230" class="detail muted">Traefik metrics</text>
  </g>
  <g>
    <rect x="1121" y="127" width="177" height="127" rx="15" class="flow"/>
    <text x="1139" y="166" class="name">Flow (Jira)</text>
    <text x="1139" y="198" class="detail">AKS</text>
    <text x="1139" y="230" class="detail muted">JMX + pods</text>
  </g>

  <path d="M219 190 H252" class="connector"/>
  <path d="M435 190 H467" class="connector"/>
  <path d="M651 190 H683" class="connector"/>
  <path d="M867 190 H899" class="connector"/>
  <path d="M1083 190 H1115" class="connector"/>

  <!-- Flow dependencies -->
  <path d="M1209 254 V305" class="connector"/>
  <g>
    <rect x="1121" y="311" width="177" height="128" rx="15" class="box"/>
    <text x="1139" y="350" class="name">PostgreSQL</text>
    <text x="1139" y="382" class="detail">Azure</text>
    <text x="1139" y="414" class="detail muted">Azure metrics</text>
  </g>
  <g>
    <rect x="689" y="311" width="178" height="128" rx="15" class="box"/>
    <text x="708" y="350" class="name">Private DNS</text>
    <text x="708" y="382" class="detail">Azure</text>
    <text x="708" y="414" class="detail muted">Azure metrics</text>
  </g>
  <g>
    <rect x="905" y="311" width="178" height="128" rx="15" class="box"/>
    <text x="923" y="350" class="name">CoreDNS</text>
    <text x="923" y="382" class="detail">AKS</text>
    <text x="923" y="414" class="detail muted">job coredns</text>
  </g>
  <path d="M1121 233 H1103 V375 H1089" class="connector"/>
  <path d="M905 375 H873" class="connector"/>

  <!-- VPN route from Flow to on-prem -->
  <path d="M1298 190 H1323 V474 H130 V503" class="connector"/>
  <text x="498" y="468" class="legend">Flow calls on-prem over the site-to-site VPN</text>

  <!-- On-premises request path -->
  <g>
    <rect x="42" y="509" width="177" height="128" rx="15" class="box"/>
    <text x="60" y="548" class="name">VPN gateway</text>
    <text x="60" y="580" class="detail">Azure</text>
    <text x="60" y="612" class="detail muted">Azure metrics</text>
  </g>
  <g>
    <rect x="258" y="509" width="177" height="128" rx="15" class="phase"/>
    <text x="276" y="548" class="name">VPN tunnel</text>
    <text x="276" y="580" class="detail">1 of 7 S2S links</text>
    <text x="276" y="612" class="detail muted">which one: P2</text>
  </g>
  <g>
    <rect x="473" y="509" width="178" height="128" rx="15" class="phase"/>
    <text x="492" y="548" class="name">Firewall</text>
    <text x="492" y="580" class="detail">on-prem</text>
    <text x="492" y="612" class="detail muted">Phase 2</text>
  </g>
  <g>
    <rect x="689" y="509" width="178" height="128" rx="15" class="box"/>
    <text x="708" y="548" class="name">Nginx</text>
    <text x="708" y="580" class="detail">MTLAPNGINX3</text>
    <text x="708" y="612" class="detail muted">node + AKS test</text>
  </g>
  <g>
    <rect x="905" y="509" width="178" height="128" rx="15" class="box"/>
    <text x="923" y="548" class="name">SAP SL</text>
    <text x="923" y="580" class="detail">MTLAPSAPLIC2</text>
    <text x="923" y="612" class="detail muted">windows + TCP</text>
  </g>
  <g>
    <rect x="1121" y="509" width="177" height="128" rx="15" class="box"/>
    <text x="1139" y="548" class="name">SAP SQL</text>
    <text x="1139" y="580" class="detail">MTLAPSAPSQL2</text>
    <text x="1139" y="612" class="detail muted">windows + SQL</text>
  </g>
  <path d="M219 573 H252" class="connector"/>
  <path d="M435 573 H467" class="connector"/>
  <path d="M651 573 H683" class="connector"/>
  <path d="M867 573 H899" class="connector"/>
  <path d="M1083 573 H1115" class="connector"/>

  <!-- On-premises service branches -->
  <path d="M562 637 V757 H683" class="connector"/>
  <path d="M831 637 V665 H994 V687" class="connector"/>
  <g>
    <rect x="689" y="693" width="178" height="128" rx="15" class="box"/>
    <text x="708" y="732" class="name">HEBIS</text>
    <text x="708" y="764" class="detail">MTLAPIIS5</text>
    <text x="708" y="796" class="detail muted">Alloy + AKS test</text>
  </g>
  <g>
    <rect x="905" y="693" width="178" height="128" rx="15" class="box"/>
    <text x="923" y="732" class="name">WMS API</text>
    <text x="923" y="764" class="detail">MTLAPIIS3</text>
    <text x="923" y="796" class="detail muted">windows + HTTP</text>
  </g>

  <!-- Explanation -->
  <text x="42" y="733" class="detail muted">AKS test = test call from</text>
  <text x="42" y="765" class="detail muted">inside AKS, same path as Flow</text>
  <text x="42" y="797" class="detail muted">(job flow-aks-to-onprem)</text>
</svg>
